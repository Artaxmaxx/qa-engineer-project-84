- summary: |
    15 Проверка просмотра каталога товаров при помощи колесика мыши
  environment: |
    Opera One (версия: 139.0.6053.22) (64 бит)
    ОС Windows 10 64-bit
  steps-to-reproduce: |
    1. прокручиваем колесо мыши вниз, вверх
  expected-result: |
    Происходит перемещение по каталогу вверх и вниз. Пользователь видит подробную информацию о товарах (название, рейтинг, цена со скидкой и без нее).
  actual-result: |
    Происходит перемещение по каталогу вверх и вниз. Пользователь не видит информацию о рейтинге товаров.

- summary: |
