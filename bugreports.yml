---
- summary: |
    1 Не работает поиск по ключевому полю
  environment: |
    Opera One (версия: 139.0.6053.22) (64 бит)
    ОС Windows 10 64-bit
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app
    2. Нажать на поле Search
    3. Ввести Fork
  expected-result: |
    На странице отфильтровываются товары содержащие указанные буквы
    По завершению ввода будет найден один товар Fork
  actual-result: |
    Начинается фильтрация по буквам товаров находящихся только на первой странице каталога
    Товар Fork находящийся на второй странице не найден

- summary: |
    3 Не работает поиск по категории
  environment: |
    Opera One (версия: 139.0.6053.22) (64 бит)
    ОС Windows 10 64-bit
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app
    2. Нажать на поле Category
    3. Выбрать Laptop
  expected-result: |
    На странице отфильтровываются товары из категории Laptop
  actual-result: |
    Категории Laptop нет, имеются категории товаров находящихся только на певой странице каталога

- summary: |
    3 Не работает очищения поля поиска по категории
  environment: |
    Google Chrome 156.0.8078.80 (официальная сборка) (64 бит)
    ОС Windows 10 64-bit
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app
    2. Нажать на поле Category
    3. Выбрать groceries
