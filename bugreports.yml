- summary: |
    1 Поиск по ключевому полю работает только по одной странице каталога
  environment: |
    Opera One (версия: 139.0.6053.22) (64 бит)
    ОС Windows 10 64-bit
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app
    2. Нажать на поле Search
    3. Ввести Fork
  expected-result: |
    На странице отфильтровываются товары содержащие указанные буквы
    По завершению ввода будет найден один товар Fork
  actual-result: |
    Начинается фильтрация по буквам товаров находящихся только на первой странице каталога
    Товар Fork находящийся на второй странице не найден

