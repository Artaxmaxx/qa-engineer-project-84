---
- summary: |
    На главной странице магазина есть поле для поиска по ключевому слову или категории
  requirement: |
    Тестируемое требование. Например, при верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например, открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка работы поля поиска по ключевому слову
  requirement: |
    При вводе букв должны последовательно оттфильтроваться товары содержащие эти буквы в названии
  prerequisites: |
    открыта страница магазина
  test-data: |
    search = kiwi
  steps:
    - Вводим k
    - Вводим i
    - Вводим w
    - Вводим i
  expected-result: |
    Должны последовательно отфильтроваться товары содержащие буквы, которые указаны в поле поиска

- summary: |
    Проверка работы поля поиска по категории
  requirement: |
    При выборе категории должны оттфильтроваться соответствующие товары
  prerequisites: |
    открыта страница магазина
  test-data: |
    search = groceries
  steps:
    - Выбираем категорию groceries
  expected-result: |
    Должны отфильтроваться соответствующие товары
  
- summary: |
    Проверка изменяемости поля поиска по категории
  requirement: |
    При выборе категории должны оттфильтроваться соответствующие товары
  prerequisites: |
    открыта страница магазина, выбрана категория groceries
  test-data: |
    search = furniture
  steps:
    - Выбираем категорию furniture
  expected-result: |
    Должны отфильтроваться соответствующие товары

- summary: |
    Проверка очищения поля поиска по категории
  requirement: |
    При выборе категории должны оттфильтроваться соответствующие товары
  prerequisites: |
    открыта страница магазина, выбрана категория groceries
  test-data: |
    search =
  steps:
    - Убираем категорию
  expected-result: |
    Должны отфильтроваться все товары
